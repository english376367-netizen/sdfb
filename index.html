const sections = [
{title:"Pronunciation",qs:[
{type:"mc",q:"Choose the word whose underlined part differs in pronunciation.",opts:["A. b<u>ear</u>","B. n<u>ear</u>","C. w<u>ear</u>","D. p<u>ear</u>"],key:1,ex:"near /ɪə/; bear, wear, pear have /eə/.",vi:"Chọn từ có phần gạch chân phát âm khác."},
{type:"mc",q:"Choose the word whose underlined part differs in pronunciation.",opts:["A. sl<u>ow</u>ly","B. d<u>ow</u>ntown","C. p<u>ow</u>er","D. cr<u>ow</u>ded"],key:0,ex:"The underlined part in slowly has /əʊ/; the others have /aʊ/.",vi:"Chọn từ có phần gạch chân phát âm khác."},
{type:"mc",q:"Choose the word whose underlined part differs in pronunciation.",opts:["A. c<u>oa</u>st","B. upl<u>oa</u>d","C. abr<u>oa</u>d","D. r<u>oa</u>dside"],key:2,ex:"abroad has /ɔː/; the others have /əʊ/.",vi:"Chọn từ có phần gạch chân phát âm khác."},
{type:"mc",q:"Choose the word whose underlined part differs in pronunciation.",opts:["A. h<u>o</u>me","B. sh<u>o</u>pping","C. c<u>o</u>mb","D. l<u>o</u>cate"],key:1,ex:"shopping has /ɒ/; the others have /əʊ/.",vi:"Chọn từ có phần gạch chân phát âm khác."},
{type:"mc",q:"Choose the word whose underlined part differs in pronunciation.",opts:["A. d<u>ou</u>ble","B. c<u>ou</u>ncil","C. s<u>ou</u>theast","D. th<u>ou</u>sand"],key:0,ex:"double has /ʌ/; the others have /aʊ/.",vi:"Chọn từ có phần gạch chân phát âm khác."},
]},
{title:"Vocabulary & Grammar",qs:[
{type:"mc",q:"The city is now a big _____ site with many half-finished buildings.",opts:["A. waste","B. tourist","C. storage","D. construction"],key:3,ex:"construction site = công trường xây dựng.",vi:"Thành phố hiện là một công trường xây dựng lớn với nhiều tòa nhà chưa hoàn thiện."},
{type:"mc",q:"The town is overcrowded and lacks public _____.",opts:["A. health","B. amenities","C. education","D. places"],key:1,ex:"public amenities = tiện ích công cộng.",vi:"Thị trấn quá đông đúc và thiếu các tiện ích công cộng."},
{type:"mc",q:"I used to live in the _____ area, but I moved to a quiet suburb two years ago.",opts:["A. downtown","B. underground","C. outskirts","D. village"],key:0,ex:"downtown area = khu vực trung tâm thành phố.",vi:"Tôi từng sống ở khu vực trung tâm thành phố, nhưng đã chuyển đến vùng ngoại ô yên tĩnh cách đây hai năm."},
{type:"mc",q:"The _____ system runs underground, so it doesn’t encounter road congestion.",opts:["A. bus","B. coach","C. metro","D. taxi"],key:2,ex:"metro system = hệ thống tàu điện ngầm.",vi:"Hệ thống tàu điện ngầm chạy dưới lòng đất nên không gặp tình trạng tắc nghẽn đường bộ."},
{type:"mc",q:"This city looks like a _____ jungle with ugly buildings and almost no parks.",opts:["A. green","B. loveable","C. tropical","D. concrete"],key:3,ex:"concrete jungle = khu rừng bê tông.",vi:"Thành phố này trông như một khu rừng bê tông với những tòa nhà xấu xí và hầu như không có công viên."},
{type:"mc",q:"I live in a _____ street which is full of people and vehicles moving around all day.",opts:["A. quiet","B. bustling","C. calm","D. empty"],key:1,ex:"bustling = nhộn nhịp, đông đúc và nhiều hoạt động.",vi:"Tôi sống trên một con phố nhộn nhịp, nơi đầy người và xe cộ di chuyển suốt ngày."},
{type:"mc",q:"Bangkok has an excellent _____ system which runs on a railway above the ground.",opts:["A. sky train","B. underground","C. ferry","D. taxi"],key:0,ex:"sky train = tàu trên cao.",vi:"Bangkok có hệ thống tàu trên cao tuyệt vời chạy trên đường ray phía trên mặt đất."},
{type:"mc",q:"Many people compliment Ha Noi on being a _____ tourist destination.",opts:["A. dusty","B. noisy","C. safe","D. polluted"],key:2,ex:"safe tourist destination = điểm đến du lịch an toàn.",vi:"Nhiều người khen Hà Nội là một điểm đến du lịch an toàn."},
{type:"mc",q:"She browsed the shop but didn’t buy anything. She found it a bit pricey. “Pricey” is closest in meaning to _____.",opts:["A. crowded","B. modern","C. attractive","D. expensive"],key:3,ex:"pricey = expensive: đắt tiền.",vi:"Cô ấy xem qua cửa hàng nhưng không mua gì. Cô thấy giá hơi đắt."},
{type:"mc",q:"The underground was packed with people. I couldn’t find a seat. “Packed with” is closest in meaning to _____.",opts:["A. full on","B. empty of","C. full of","D. convenient for"],key:2,ex:"packed with = full of: đầy, chật kín.",vi:"Tàu điện ngầm chật kín người. Tôi không tìm được chỗ ngồi."},
{type:"mc",q:"Her team is carrying out a project to recycle food waste. “Carrying out” is closest in meaning to _____.",opts:["A. running","B. proposing","C. funding","D. aiming"],key:0,ex:"carry out = run/conduct: tiến hành, thực hiện.",vi:"Nhóm của cô ấy đang thực hiện một dự án tái chế rác thực phẩm."},
{type:"mc",q:"Neither Lan nor Hoa stayed home alone last weekend. They went to the shopping mall together. The opposite of “stayed home alone” is _____.",opts:["A. hung out with one another","B. came down with one another","C. got rid of one another","D. looked up to one another"],key:0,ex:"stayed home alone (ở nhà một mình) trái nghĩa với hung out with one another (đi chơi cùng nhau).",vi:"Cuối tuần trước, cả Lan và Hoa đều không ở nhà một mình. Họ cùng nhau đến trung tâm mua sắm."},
{type:"mc",q:"Hoa: I never use buses when getting around. They are always late. Jack: Well, it’s not that bad. They are reliable now. The opposite of “reliable” here is _____.",opts:["A. on time","B. late","C. timely","D. terrible"],key:1,ex:"reliable = đáng tin cậy; trong ngữ cảnh này trái nghĩa là late = muộn.",vi:"Hoa: Tôi không bao giờ đi xe buýt khi di chuyển. Chúng luôn trễ. Jack: Cũng không tệ đến vậy đâu. Bây giờ chúng đáng tin cậy rồi."},
{type:"text",q:"Write the correct comparative form: The (busy) _____ the street is, the less I like it.",answers:["busier"],ex:"Cấu trúc The + so sánh hơn…, the + so sánh hơn…; busy → busier.",vi:"Đường phố càng đông đúc thì tôi càng không thích."},
{type:"text",q:"Write the correct comparative form: The later it gets at night, the (cold) _____ it becomes.",answers:["colder"],ex:"cold → colder.",vi:"Càng về đêm thì trời càng lạnh."},
{type:"text",q:"Write the correct comparative forms: The (light) _____ the street was, the (safe) _____ I felt.",answers:["lighter, safer"],altAnswers:["lighter safer"],ex:"light → lighter; safe → safer.",vi:"Đường phố càng sáng thì tôi càng cảm thấy an toàn hơn."},
{type:"text",q:"Write the correct comparative form: The (crowded) _____ the bus got, the more difficult it was for me to breathe.",answers:["more crowded"],ex:"crowded → more crowded.",vi:"Xe buýt càng đông thì tôi càng khó thở."},
{type:"text",q:"Complete: I fear that the more modern city life is, the _____ (friendly) people are to one another.",answers:["less friendly"],ex:"less friendly = kém thân thiện hơn.",vi:"Tôi sợ rằng cuộc sống thành phố càng hiện đại thì mọi người càng ít thân thiện với nhau."},
{type:"text",q:"Complete: The (close) _____ it gets to pick-up time, the (difficult) _____ traffic around the school becomes.",answers:["closer, more difficult"],altAnswers:["closer more difficult"],ex:"close → closer; difficult → more difficult.",vi:"Càng gần giờ đón học sinh, giao thông quanh trường càng khó khăn."},
{type:"text",q:"Correct the mistake: “Safer a city is, the more liveable it becomes.” Write the corrected sentence.",answers:["The safer a city is, the more liveable it becomes."],ex:"Trong cấu trúc so sánh kép cần “The + comparative…” ở cả hai vế.",vi:"Thành phố càng an toàn thì càng trở nên đáng sống."},
{type:"text",q:"Correct the mistake: “Our city is age-friendly. We make it easy for the elderly to get along by public transport.”",answers:["Our city is age-friendly. We make it easy for the elderly to get around by public transport."],ex:"get around = đi lại; get along thường là hòa thuận.",vi:"Thành phố chúng tôi thân thiện với người cao tuổi. Chúng tôi giúp họ đi lại dễ dàng bằng phương tiện công cộng."},
{type:"text",q:"Correct the mistake: “The bigger the shopping mall is, the attractive it is to teenagers.”",answers:["The bigger the shopping mall is, the more attractive it is to teenagers."],ex:"attractive là tính từ dài, so sánh hơn là more attractive.",vi:"Trung tâm mua sắm càng lớn thì càng hấp dẫn thanh thiếu niên."},
{type:"text",q:"Correct the mistake: “Although people wanted to carry out with the project, the company stopped funding it.”",answers:["Although people wanted to carry on with the project, the company stopped funding it."],ex:"carry on with = tiếp tục; carry out = thực hiện.",vi:"Mặc dù mọi người muốn tiếp tục dự án nhưng công ty đã ngừng tài trợ dự án."},
{type:"text",q:"Correct the mistake: “The local authority tried to cut on private car use but they didn’t succeed.”",answers:["The local authority tried to cut down on private car use but they didn’t succeed."],ex:"cut down on = cắt giảm.",vi:"Chính quyền địa phương cố gắng cắt giảm việc sử dụng ô tô cá nhân nhưng không thành công."},
{type:"text",q:"Correct the mistake: “The closer an area is to the downtown, denser its population is.”",answers:["The closer an area is to the downtown, the denser its population is."],ex:"Cần thêm “the” trước tính từ so sánh hơn ở vế thứ hai.",vi:"Khu vực càng gần trung tâm thành phố thì mật độ dân số càng cao."},
{type:"text",q:"Correct the mistake: “Many teens prefer hanging in at shopping malls to outdoor places.”",answers:["Many teens prefer hanging out at shopping malls to outdoor places."],ex:"hang out = đi chơi; không dùng hang in trong nghĩa này.",vi:"Nhiều thanh thiếu niên thích đi chơi ở trung tâm mua sắm hơn là ở những nơi ngoài trời."},
{type:"text",q:"Correct the mistake: “Hoang is coming up with a fever. The more time that passes, the higher his temperature is.”",answers:["Hoang is coming down with a fever. The more time that passes, the higher his temperature is."],ex:"come down with = bắt đầu mắc bệnh.",vi:"Hoàng đang bắt đầu bị sốt. Càng nhiều thời gian trôi qua, nhiệt độ của cậu ấy càng cao."}
]},
{title:"Speaking",qs:[
{type:"mc",q:"Minh: I can lend you this book if you are interested in reading it. Peter: _____",opts:["A. You did a great job!","B. Thanks. I prefer going by bus.","C. I didn’t know you like reading books.","D. Thanks. I’ll take good care of it."],key:3,ex:"D là lời đáp phù hợp khi được cho mượn sách.",vi:"Minh: Mình có thể cho bạn mượn cuốn sách này nếu bạn muốn đọc. Peter: Cảm ơn. Mình sẽ giữ gìn nó cẩn thận."},
{type:"mc",q:"Hoa: Ms Mai won’t come back until noon. Would you like me to leave a note for her? Ms Hoai: _____",opts:["A. Sorry. I can’t find my notes.","B. That’s great. Thanks for your help.","C. Why would you like to leave?","D. How about leaving her alone?"],key:1,ex:"B là lời cảm ơn phù hợp khi được đề nghị giúp đỡ.",vi:"Hoa: Cô Mai sẽ không về cho đến trưa. Cô có muốn cháu để lại lời nhắn cho cô ấy không? Cô Hoài: Tuyệt quá. Cảm ơn cháu đã giúp."},
{type:"mc",q:"Harry: Oh no! I missed the bus to the underground. Mr Lam: _____",opts:["A. You’re excellent. Congratulations!","B. Your friends will miss you a lot.","C. The underground is much faster than the bus.","D. Don’t worry. I can take you to the station."],key:3,ex:"D trấn an và đề nghị giúp đỡ.",vi:"Harry: Ôi không! Tôi đã lỡ chuyến xe buýt đến tàu điện ngầm. Ông Lâm: Đừng lo. Tôi có thể đưa bạn đến nhà ga."},
{type:"mc",q:"James: _____ Chloe: Yes, please. That’s so kind of you.",opts:["A. Excuse me. Can I sit here?","B. Do you commute to work every day?","C. I can show you how this smart card works.","D. Would you mind taking this book to Ms Hoa’s office?"],key:2,ex:"C phù hợp vì Chloe đồng ý với lời đề nghị được chỉ cách sử dụng thẻ.",vi:"James: Tôi có thể chỉ cho bạn cách sử dụng thẻ thông minh này. Chloe: Vâng, làm ơn. Bạn thật tốt bụng."},
{type:"mc",q:"Ann: _____ Hoang: Would you like me to get a taxi for you?",opts:["A. The tram is late today.","B. The Melbourne tram is great.","C. The sky train is always on time.","D. A taxi can get stuck in traffic congestion."],key:0,ex:"A giải thích vì sao Hoàng đề nghị gọi taxi.",vi:"Ann: Hôm nay xe điện đến muộn. Hoàng: Bạn có muốn tôi gọi taxi cho bạn không?"},
{type:"mc",q:"Complete the conversation: Elena: I wish I could live in Da Lat. It’s such a healthy place to live. Hoa: _____",opts:["A. Sounds like a nice place!","B. I like the fresh air here. I guess it’s because there are no factories around.","C. Hey, I can take you to a vegetable hotpot restaurant if you like.","D. There isn’t a lot of trash all over the place. How about your home town?","E. That’s so kind of you."],key:1,ex:"Đáp án B nói về không khí trong lành, phù hợp với ý Đà Lạt là nơi sống lành mạnh.",vi:"Elena: Mình ước có thể sống ở Đà Lạt. Đó là nơi rất tốt cho sức khỏe. Hoa: Mình thích không khí trong lành ở đây. Mình đoán là vì xung quanh không có nhà máy nào."},
{type:"mc",q:"Complete the conversation: Hoa: It looks that way. _____ Elena: Well, it’s a nice place. The best thing about living there is that shopping is convenient.",opts:["A. Sounds like a nice place!","B. I like the fresh air here. I guess it’s because there are no factories around.","C. Hey, I can take you to a vegetable hotpot restaurant if you like.","D. There isn’t a lot of trash all over the place. How about your home town?","E. That’s so kind of you."],key:3,ex:"D nối ý về đường phố sạch sẽ và hỏi về quê hương của Elena.",vi:"Hoa: Có vẻ đúng vậy. Không có nhiều rác ở khắp nơi. Còn quê hương của bạn thì sao? Elena: Đó là một nơi tuyệt vời. Điều hay nhất là việc mua sắm thuận tiện."},
{type:"mc",q:"Complete the conversation: Elena: Shopping is convenient. I can buy almost everything I need. Hoa: _____",opts:["A. Sounds like a nice place!","B. I like the fresh air here. I guess it’s because there are no factories around.","C. Hey, I can take you to a vegetable hotpot restaurant if you like.","D. There isn’t a lot of trash all over the place. How about your home town?","E. That’s so kind of you."],key:0,ex:"A là phản hồi tự nhiên sau khi nghe ưu điểm của thành phố.",vi:"Elena: Việc mua sắm thuận tiện. Mình có thể mua gần như mọi thứ cần. Hoa: Nghe có vẻ là một nơi tuyệt vời!"},
{type:"mc",q:"Complete the conversation: Elena: I prefer healthier food. Hoa: _____ Da Lat has great vegetables.",opts:["A. Sounds like a nice place!","B. I like the fresh air here. I guess it’s because there are no factories around.","C. Hey, I can take you to a vegetable hotpot restaurant if you like.","D. There isn’t a lot of trash all over the place. How about your home town?","E. That’s so kind of you."],key:2,ex:"C đưa ra lời đề nghị phù hợp với mong muốn ăn uống lành mạnh.",vi:"Elena: Mình thích đồ ăn lành mạnh hơn. Hoa: Này, mình có thể dẫn bạn đến một nhà hàng lẩu rau nếu bạn thích. Đà Lạt có rau rất ngon."},
{type:"mc",q:"Complete the conversation: Elena: Thanks. I’d love to. _____",opts:["A. Sounds like a nice place!","B. I like the fresh air here. I guess it’s because there are no factories around.","C. Hey, I can take you to a vegetable hotpot restaurant if you like.","D. There isn’t a lot of trash all over the place. How about your home town?","E. That’s so kind of you."],key:4,ex:"E là lời cảm ơn đáp lại lời đề nghị giúp đỡ.",vi:"Elena: Cảm ơn. Mình rất thích. Bạn thật tốt bụng."},
{type:"text",q:"Speaking task: Write the first two lines of a similar conversation using the prompts: George wishes to live in a small coastal town; Nhung says she likes the fresh air, green parks and seafood.",answers:["George: I wish I could live in a small coastal town like yours. It sounds so peaceful. Nhung: It really is! I love the fresh air, all the green parks, and the seafood is amazing."],ex:"Đáp án mẫu: George: I wish I could live in a small coastal town like yours. It sounds so peaceful. Nhung: It really is! I love the fresh air, all the green parks, and the seafood is amazing.",vi:"George: Tôi ước mình có thể sống ở một thị trấn nhỏ ven biển như nơi bạn sống. Nghe thật yên bình. Nhung: Đúng vậy! Tôi yêu không khí trong lành, những công viên xanh và hải sản tuyệt vời."}
]},
{title:"Reading",qs:[
{type:"mc",q:"Fill in blank (1): The local newspaper carried out a survey with city dwellers about how to make the city a more _____ place.",opts:["A. lifelong","B. living","C. lively","D. liveable"],key:3,ex:"liveable = đáng sống.",vi:"Tờ báo địa phương đã khảo sát người dân thành phố về cách biến thành phố thành một nơi đáng sống hơn.",reading:"The local newspaper carried out a survey with city dwellers about how to make the city a more (1) ____ place. Most participants in the survey talked about the city’s traffic. First, they wanted stricter traffic (2) ____ to stop drivers from ignoring traffic lights and breaking speed limits. This would help reduce road accidents. In addition, they hoped their city would improve its (3) ____ system. For example, buses should be clean and have air conditioners. There should be bus lines that reach almost all areas in the city, so it would be easy for people to (4) ____. They said that good public transport could also (5) ____ the city money. The local authority wouldn’t need to construct new parking lots and (6) ____ roads to cater for the increasing number of private cars. Finally, the survey (7) ____ suggested the local authority build traffic apps. The apps could recommend to drivers the best routes to avoid traffic (8) ____. The sooner the government started implementing these, the more convenient it would be to travel around the city.",readingVi:"Tờ báo địa phương đã thực hiện một cuộc khảo sát với người dân thành phố về cách biến thành phố thành nơi đáng sống hơn. Hầu hết người tham gia nói về giao thông thành phố. Trước hết, họ muốn luật giao thông nghiêm ngặt hơn để ngăn tài xế phớt lờ đèn giao thông và chạy quá tốc độ. Điều này giúp giảm tai nạn. Ngoài ra, họ hy vọng thành phố cải thiện hệ thống giao thông công cộng. Xe buýt nên sạch và có điều hòa. Cần có tuyến xe buýt đến hầu hết khu vực để mọi người đi lại dễ dàng. Họ nói giao thông công cộng tốt cũng giúp thành phố tiết kiệm tiền. Chính quyền sẽ không cần xây bãi đỗ xe mới và mở rộng đường để đáp ứng số lượng ô tô cá nhân tăng lên. Cuối cùng, người tham gia khảo sát đề nghị xây dựng ứng dụng giao thông để gợi ý tuyến đường tốt nhất tránh tắc nghẽn. Chính phủ càng sớm thực hiện thì việc đi lại càng thuận tiện."},

{type:"mc",q:"In the passage “Living in Vancouver”, who sometimes doesn’t cook?",opts:["A. Gina","B. Olivia","C. Hoai","D. None of them"],key:1,ex:"Olivia says that when she is too busy to cook, she buys prepared meals.",vi:"Trong bài đọc “Sống ở Vancouver”, ai đôi khi không nấu ăn?",reading:"Living in Vancouver\nVancouver, a coastal city in Canada, ranks among the most liveable cities in the world. Let’s meet three residents to learn why they love this city.\n\nA. Gina (20 years old)\nI fell in love with Vancouver’s natural habitats. I can go hiking in the summer and snowboarding in the winter in the mountains. Sometimes I pack my favourite foods and go to Kitsilano Beach to get a bit of sunshine. I like swimming in the Kitsilano pool, which is the longest outdoor swimming pool in North America.\n\nB. Olivia (30 years old)\nLife in Vancouver is convenient. The food here is good. There are both great restaurants and food trucks. Farmers’ markets offer a wide range of fresh produce. When I’m too busy to cook, I pick up prepared meals in the supermarket.\n\nC. Hoai (35 years old)\nThis is such a kid-friendly place. The whole city is like an adventure playground. There are hundreds of activities to entertain children. At weekends, I take my daughters to the mind-blowing museum, explore a rainforest, or play outdoor games with them. Vancouver is a perfect place for family life.",readingVi:"Sống ở Vancouver\nVancouver, một thành phố ven biển ở Canada, nằm trong số những thành phố đáng sống nhất thế giới. Hãy gặp ba cư dân để biết vì sao họ yêu thành phố này.\n\nA. Gina (20 tuổi): Tôi yêu môi trường tự nhiên của Vancouver. Tôi có thể đi bộ đường dài vào mùa hè và trượt ván trên tuyết vào mùa đông trên núi. Đôi khi tôi chuẩn bị món ăn yêu thích rồi đến bãi biển Kitsilano để tận hưởng ánh nắng. Tôi thích bơi ở hồ bơi Kitsilano, hồ bơi ngoài trời dài nhất Bắc Mỹ.\n\nB. Olivia (30 tuổi): Cuộc sống ở Vancouver thuận tiện. Đồ ăn ngon, có nhà hàng và xe bán đồ ăn tuyệt vời. Chợ nông sản có nhiều loại nông sản tươi. Khi quá bận nấu ăn, tôi mua đồ ăn đã chế biến sẵn ở siêu thị.\n\nC. Hoài (35 tuổi): Đây là nơi rất thân thiện với trẻ em. Cả thành phố giống như sân chơi phiêu lưu. Có hàng trăm hoạt động giải trí cho trẻ. Cuối tuần, tôi đưa các con gái đến bảo tàng tuyệt vời, khám phá rừng mưa hoặc chơi trò chơi ngoài trời cùng chúng. Vancouver là nơi hoàn hảo cho cuộc sống gia đình."},

{type:"mc",q:"What is the passage “City life drawbacks” mainly about?",opts:["A. The reasons for moving to the suburbs","B. The disadvantages of city life","C. The high cost of living only","D. The causes of pollution only"],key:1,ex:"Đoạn văn trình bày nhiều bất lợi của cuộc sống thành phố: chi phí cao, ô nhiễm và thiếu không gian.",vi:"Đoạn văn chủ yếu nói về những bất lợi của cuộc sống thành phố.",reading:"Twenty years ago, people tried to leave the suburbs for cities but nowadays many people are reluctant to make such a move. They say that compared to suburban areas, city life has many drawbacks.\n\nThe high cost of living is the first disadvantage. The bigger the city is, the higher the living cost is. Accommodation and petrol are expensive. Food and drinks are also pricey. Apart from that, city people seem to suffer from more noise and air pollution. The densely populated neighbourhoods, busy traffic, and big construction sites make cities noisy and dusty. These are harmful to people’s health, such as increasing their stress levels, disturbing their sleep and making them suffer from breathing problems.\n\nLack of space is another drawback of city life. House prices are high in the city, so people tend to live in smaller houses or in apartment blocks. Many cities lack spaces for outdoor activities; therefore, teenagers often hang out at shopping malls or in entertainment complexes instead of doing sports outdoors.\n\nThe cities’ authorities are trying to overcome these problems. However, they still have a long way to go before they can reduce living costs and pollution, and increase green space to make all cities in the world more liveable places.",readingVi:"Hai mươi năm trước, người ta cố gắng rời vùng ngoại ô để chuyển vào thành phố, nhưng ngày nay nhiều người ngần ngại làm vậy. Họ cho rằng so với vùng ngoại ô, cuộc sống thành phố có nhiều bất lợi.\n\nChi phí sinh hoạt cao là bất lợi đầu tiên. Thành phố càng lớn thì chi phí sinh hoạt càng cao. Nhà ở và xăng dầu đắt đỏ. Thức ăn và đồ uống cũng đắt. Ngoài ra, người dân thành phố dường như chịu nhiều ô nhiễm tiếng ồn và không khí hơn. Các khu dân cư đông đúc, giao thông bận rộn và công trường xây dựng lớn khiến thành phố ồn ào, bụi bặm. Những điều này gây hại cho sức khỏe, làm tăng căng thẳng, ảnh hưởng giấc ngủ và gây vấn đề hô hấp.\n\nThiếu không gian là một bất lợi khác. Giá nhà cao nên người dân thường sống trong nhà nhỏ hoặc chung cư. Nhiều thành phố thiếu nơi hoạt động ngoài trời; vì thế thanh thiếu niên thường đến trung tâm mua sắm hoặc khu giải trí thay vì chơi thể thao ngoài trời.\n\nChính quyền thành phố đang cố gắng khắc phục những vấn đề này. Tuy nhiên, họ vẫn còn nhiều việc phải làm để giảm chi phí sinh hoạt và ô nhiễm, đồng thời tăng không gian xanh để các thành phố trên thế giới đáng sống hơn."},

goài ra, người dân thành phố dường như chịu nhiều ô nhiễm tiếng ồn và không khí hơn. Các khu dân cư đông đúc, giao thông bận rộn và công trường xây dựng lớn khiến thành phố ồn ào, bụi bặm. Những điều này gây hại cho sức khỏe, làm tăng căng thẳng, ảnh hưởng giấc ngủ và gây vấn đề hô hấp.\n\nThiếu không gian là một bất lợi khác. Giá nhà cao nên người dân thường sống trong nhà nhỏ hoặc chung cư. Nhiều thành phố thiếu nơi hoạt động ngoài trời; vì thế thanh thiếu niên thường đến trung tâm mua sắm hoặc khu giải trí thay vì chơi thể thao ngoài trời.\n\nChính quyền thành phố đang cố gắng khắc phục những vấn đề này. Tuy nhiên, họ vẫn còn nhiều việc phải làm để giảm chi phí sinh hoạt và ô nhiễm, đồng thời tăng không gian xanh để các thành phố trên thế giới đáng sống hơn."},

{title:"Writing",qs:[
{type:"text",q:"Make a sentence: boy / came / food poison / after / eat / street food.",answers:["The boy came down with food poisoning after eating street food."],ex:"come down with = mắc bệnh; sau after dùng V-ing.",vi:"Cậu bé bị ngộ độc thực phẩm sau khi ăn thức ăn đường phố."},
{type:"text",q:"Make a sentence: big / mall / is, / the easier / it / people / to / lost / in it.",answers:["The bigger the mall is, the easier it is for people to get lost in it."],ex:"Cấu trúc càng… càng…; get lost = bị lạc.",vi:"Trung tâm mua sắm càng lớn thì mọi người càng dễ bị lạc trong đó."},
{type:"text",q:"Make a sentence: They / decided / hang / cinema / instead / a coffee shop.",answers:["They decided to hang out at the cinema instead of a coffee shop."],ex:"hang out = đi chơi; instead of = thay vì.",vi:"Họ quyết định đi chơi ở rạp chiếu phim thay vì quán cà phê."},
{type:"text",q:"Make a sentence: The restaurant / bit / pricey, / so / it was / popular / teenagers.",answers:["The restaurant was a bit pricey, so it was not popular among teenagers.","The restaurant was a bit pricey, so it was not popular with teenagers."],ex:"popular with/among somebody; theo đáp án mẫu câu mang nghĩa không được ưa chuộng.",vi:"Nhà hàng hơi đắt tiền nên không được thanh thiếu niên ưa chuộng."},
{type:"text",q:"Make a sentence: Travel / a dusty road / every day / causes / have / itchy eyes / runny nose.",answers:["Travelling on a dusty road every day causes me to have itchy eyes and a runny nose.","Traveling on a dusty road every day causes me to have itchy eyes and a runny nose."],ex:"cause + somebody + to V; travelling/traveling đều được.",vi:"Đi trên con đường bụi bặm mỗi ngày khiến tôi bị ngứa mắt và sổ mũi."},
{type:"mc",q:"It’s difficult to get around the city at rush hours due to congested roads.",opts:["A. Moving to the city at rush hours is not a good idea.","B. It’s not easy at rush hours because the downtown is congested.","C. Traffic congestion makes it difficult to travel in the city at rush hours.","D. Don’t get around the city because all roads are congested."],key:2,ex:"C giữ nguyên ý: ùn tắc giao thông khiến việc đi lại trong thành phố vào giờ cao điểm khó khăn.",vi:"Rất khó di chuyển quanh thành phố vào giờ cao điểm do đường bị tắc nghẽn."},
{type:"mc",q:"The city council will cut down on electricity used for public lighting.",opts:["A. There will soon be no public lighting in the city.","B. The city council intends to reduce energy used to light public places.","C. The city council will cut down on investment in public amenities.","D. Public lights use much electricity so the city council will remove them."],key:1,ex:"cut down on = giảm bớt; phương án B diễn đạt lại đúng ý.",vi:"Hội đồng thành phố sẽ cắt giảm lượng điện sử dụng cho chiếu sáng công cộng."},
{type:"mc",q:"They should reduce the amount of fatty foods in their daily meals.",opts:["A. They should cut down on the amount of fatty foods in their daily meals.","B. They should eat more fatty foods in their daily meals.","C. They shouldn’t cook fatty foods every day.","D. The more fatty foods they eat, the healthier they become."],key:0,ex:"reduce = cut down on: giảm bớt.",vi:"Họ nên giảm lượng thức ăn béo trong các bữa ăn hằng ngày."},
{type:"mc",q:"Jack caught a cold after walking home in the rain.",opts:["A. Jack felt cold because he had to walk home in the rain.","B. The rain was cold, so Jack tried to walk home as quickly as possible.","C. The heavier the rain, the more quickly Jack walked home.","D. Jack came down with a cold because he walked home in rainy weather."],key:3,ex:"come down with a cold = bị cảm lạnh.",vi:"Jack bị cảm lạnh sau khi đi bộ về nhà dưới mưa."},
{type:"mc",q:"Tom conducted research to find out how much food his friends were throwing away.",opts:["A. Tom’s research was about wasting food at his friends’ home.","B. Tom did research on how to throw away food without harming the environment.","C. Tom’s friends carried out research because he was throwing away too much food.","D. Tom carried out a study on his friends’ food-wasting habit."],key:3,ex:"conduct research = carry out a study: tiến hành nghiên cứu.",vi:"Tom tiến hành nghiên cứu để tìm hiểu bạn bè mình vứt bỏ bao nhiêu thức ăn."}
]}

let si=0, qi=0;
const states=sections.map(s=>s.qs.map(()=>({done:false,correct:false,value:null})));
function unlock(){if(document.getElementById('pw').value==='367'){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}else document.getElementById('pwmsg').textContent='Incorrect password. Try again.'}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
function norm(s){return String(s||'').toLowerCase().trim().replace(/[’‘]/g,"'").replace(/[.,!?;:]/g,'').replace(/\s+/g,' ')}
function buildTabs(){let el=document.getElementById('tabs');el.innerHTML='';sections.forEach((s,i)=>{let b=document.createElement('button');b.className='tab'+(i===si?' active':'');b.textContent=s.title+' ('+states[i].filter(x=>x.done).length+'/'+s.qs.length+')';b.onclick=()=>{si=i;qi=0;render()};el.appendChild(b)})}
function render(){buildTabs();let sec=sections[si],q=sec.qs[qi],st=states[si][qi];document.getElementById('sectionTitle').textContent=sec.title;document.getElementById('score').textContent='Score: '+states[si].filter(x=>x.done&&x.correct).length+'/'+sec.qs.length;let nav=document.getElementById('qnav');nav.innerHTML='';sec.qs.forEach((it,i)=>{let b=document.createElement('button');b.textContent=i+1;b.className=(i===qi?'current ':'')+(states[si][i].done?'done':'');b.onclick=()=>{qi=i;render()};nav.appendChild(b)});
let out=document.getElementById('question');out.innerHTML='<div class="muted">Question '+(qi+1)+' of '+sec.qs.length+'</div>';
if(q.reading){let panes=document.createElement('div');panes.className='grid';let left=document.createElement('div');left.className='reading';left.innerHTML='<h3>Reading passage</h3><div style="white-space:pre-line">'+q.reading+'</div><hr><h3>Bản dịch tiếng Việt</h3><div style="white-space:pre-line">'+q.readingVi+'</div>';let right=document.createElement('div');right.className='reading';right.style.background='#fff';right.innerHTML='<h3>Question '+(qi+1)+'</h3>';let qbox=document.createElement('div');qbox.innerHTML='<h3>'+q.q+'</h3>';right.appendChild(qbox);panes.append(left,right);out.appendChild(panes);var target=right;}else{out.insertAdjacentHTML('beforeend','<h3>'+q.q+'</h3>');var target=out;}
if(q.type==='mc'){q.opts.forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.innerHTML=o;if(st.done){b.disabled=true;if(i===q.key)b.classList.add('correct');else if(st.value===i)b.classList.add('wrong')}b.onclick=()=>{if(st.done)return;st.done=true;st.value=i;st.correct=i===q.key;render()};target.appendChild(b)})}
else{let inp=document.createElement('textarea');inp.rows=q.answers.length>1&&q.answers[0].length>120?5:2;inp.placeholder='Type your answer here…';inp.value=st.value||'';inp.disabled=st.done;target.appendChild(inp);let row=document.createElement('div');row.className='row';let check=document.createElement('button');check.textContent='Check answer';check.disabled=st.done;check.onclick=()=>{let v=inp.value;st.value=v;st.done=true;let all=[...(q.answers||[]),...(q.altAnswers||[])];st.correct=all.some(a=>norm(a)===norm(v));render()};row.appendChild(check);target.appendChild(row)}
if(st.done){let f=document.createElement('div');f.className='feedback';f.innerHTML='<div class="'+(st.correct?'ok':'bad')+'">'+(st.correct?'Correct!':'Not quite.')+'</div><p><b>Explanation:</b> '+q.ex+'</p><p><b>Vietnamese meaning:</b> '+q.vi+'</p>'+(q.type==='text'?'<p><b>Suggested answer:</b> '+q.answers[0]+'</p>':'');target.appendChild(f)}
let row=document.createElement('div');row.className='row';row.style.marginTop='16px';let p=document.createElement('button');p.className='secondary';p.textContent='← Previous';p.disabled=qi===0;p.onclick=prev;let n=document.createElement('button');n.textContent='Next →';n.disabled=qi===sec.qs.length-1;n.onclick=next;let r=document.createElement('button');r.className='secondary';r.textContent='Reset this question';r.onclick=()=>{states[si][qi]={done:false,correct:false,value:null};render()};row.append(p,n,r);target.appendChild(row)}
function prev(){if(qi>0){qi--;render()}}function next(){if(qi<sections[si].qs.length-1){qi++;render()}}
function resetSection(){if(confirm('Reset all answers in this section?')){states[si]=sections[si].qs.map(()=>({done:false,correct:false,value:null}));qi=0;render()}}
</script></body></html>
